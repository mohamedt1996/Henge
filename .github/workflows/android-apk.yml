name: Android APK

on:
  push:
    branches: [android-port]
    tags: ['v*-android']
    paths-ignore: ['ci/symbolize/**', '.github/workflows/symbolize.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.1.0-android); leave empty for just a build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu g++-aarch64-linux-gnu clang cmake pkg-config bison flex \
            qemu-user spirv-tools libvulkan-dev mesa-vulkan-drivers
          pip install --user meson ninja mako pyyaml packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: ~/deps
          key: deps-${{ hashFiles('android/build_deps.sh', 'android/patches/**', 'third_party/mbedtls/**') }}

      - name: Engine dependencies (zlib, libffi, pcre2, glib, libslirp, mbedtls, curl, lzfse)
        run: |
          if [ ! -f ~/deps/arm64/lib/libcurl.a ] || [ ! -d ~/deps/src/lzfse ]; then android/build_deps.sh ~/deps/arm64; fi

      - name: Engine (hengevm-android, static arm64)
        run: |
          make -f android/Makefile build/android/hengevm-android DEPS=$HOME/deps/arm64 -j"$(nproc)"
          mkdir -p android/apk/app/src/main/jniLibs/arm64-v8a
          cp build/android/hengevm-android android/apk/app/src/main/jniLibs/arm64-v8a/libhengevm.so
          aarch64-linux-gnu-strip android/apk/app/src/main/jniLibs/arm64-v8a/libhengevm.so
          make -f android/Makefile build/android/gunyah-probe
          cp build/android/gunyah-probe android/apk/app/src/main/jniLibs/arm64-v8a/libghprobe.so
          aarch64-linux-gnu-strip android/apk/app/src/main/jniLibs/arm64-v8a/libghprobe.so

      - name: Cache air2spv dependencies (LLVM 22, Mesa's NIR for arm64)
        uses: actions/cache@v4
        with:
          path: ~/air2spv-deps
          key: air2spv-deps-arm64-${{ hashFiles('android/air2spv/build.sh') }}

      - name: air2spv for the tablet (static arm64, run by the renderer to translate macOS's shaders)
        run: |
          android/air2spv/build.sh deps arm64
          android/air2spv/build.sh arm64
          android/air2spv/build.sh test arm64
          cp build/air2spv-arm64/air2spv android/apk/app/src/main/jniLibs/arm64-v8a/libair2spv.so
          aarch64-linux-gnu-strip android/apk/app/src/main/jniLibs/arm64-v8a/libair2spv.so

      - name: Renderer self-test (Vulkan on lavapipe)
        run: android/gpu/replay/selftest.sh

      - name: Cache reims-vgpu build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/reims-work/target
          key: reims-${{ hashFiles('android/gpu/reims/build.sh', 'android/gpu/reims/android_port.py', 'android/gpu/reims/window_android.rs') }}

      # Graphics: reims. Experimental: a failure here leaves the APK without it (the app says so).
      - name: "reims-vgpu for the tablet (Graphics: reims)"
        continue-on-error: true
        env:
          REIMS_WORK: /home/runner/reims-work
          CARGO_TARGET_DIR: /home/runner/reims-work/target
        run: android/gpu/reims/build.sh

      # Graphics: reims: Turnip, Mesa's open Adreno Vulkan driver, as an alternative to the system's
      # (the app's "Vulkan driver" setting). A prebuilt for Android (KGSL) from whitebelyash's CI of
      # upstream Mesa; MIT. The step after it fails the build if the APK would go out without it.
      - name: "Turnip for the tablet (Graphics: reims, Vulkan driver: Turnip)"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TURNIP_REPO: whitebelyash/freedreno_turnip-CI
          TURNIP_TAG: stu_v2
        run: |
          set -eu
          rm -rf turnip && mkdir turnip && cd turnip
          gh release download "$TURNIP_TAG" -R "$TURNIP_REPO" --pattern '*.zip' || gh release download "$TURNIP_TAG" -R "$TURNIP_REPO"
          ls -la
          for z in *.zip; do mkdir -p "x/${z%.zip}" && unzip -q -o "$z" -d "x/${z%.zip}"; done
          find x -type f \( -name '*.so' -o -name 'meta.json' \) -print
          # The plain build before the "sync" one; the adrenotools zip holds the one library.
          so=$(find x -type f -name '*.so' | sort | grep -v -i sync | head -1)
          [ -n "$so" ] || so=$(find x -type f -name '*.so' | sort | head -1)
          [ -n "$so" ] || { echo "::warning::Turnip: no .so in the release; the APK has no Turnip"; exit 1; }
          file "$so"; readelf -d "$so" | grep NEEDED || true
          # Mesa for Android exports one symbol, HMI (the driver as Android's hardware module), which
          # turnip_load.cpp opens; a desktop-style build exports the ICD's entry point instead.
          syms=$(readelf -W --dyn-syms "$so" | awk '$7 != "UND" {print $8}')
          echo "$syms" | grep -q -x -e HMI -e vk_icdGetInstanceProcAddr || { echo "::warning::Turnip: neither HMI nor vk_icdGetInstanceProcAddr exported; the APK has no Turnip"; exit 1; }
          cp "$so" ../android/apk/app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so
          echo "turnip: $so -> libvulkan_freedreno.so ($(stat -c %s "$so") bytes)"

      - name: Turnip is in the APK's libraries
        run: ls -la android/apk/app/src/main/jniLibs/arm64-v8a/ && test -s android/apk/app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: APK
        run: |
          gradle -p android/apk assembleRelease --no-daemon
          cp android/apk/app/build/outputs/apk/release/app-release.apk Henge-android.apk

      - name: Release files
        run: |
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME}"
          case "$V" in v*) ;; *) V=latest ;; esac
          echo "V=$V" >> "$GITHUB_ENV"
          mkdir -p eng && cp android/apk/app/src/main/jniLibs/arm64-v8a/libhengevm.so eng/hengevm-android && chmod +x eng/hengevm-android
          cp Henge-android.apk "Henge-android-$V.apk"
          tar czf "hengevm-android-arm64-$V.tar.gz" -C eng hengevm-android
          sha256sum "Henge-android-$V.apk" "hengevm-android-arm64-$V.tar.gz" > SHA256SUMS.txt
          sed "s/<version>/$V/g" android/RELEASE_NOTES.md > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: Henge-android
          path: Henge-android.apk

      # libhengegpu.so before the APK strips it: the names for the offsets in the app's backtraces and
      # thread samples ("pc 0x... libhengegpu.so" in henge.log), with addr2line or llvm-symbolizer.
      - name: Symbols of libhengegpu.so
        continue-on-error: true
        run: |
          mkdir -p symbols
          find android/apk/app/build android/apk/app/.cxx -name libhengegpu.so -printf '%s %p\n' 2>/dev/null | sort -n | tail -3
          so=$(find android/apk/app/build android/apk/app/.cxx -name libhengegpu.so -printf '%s %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)
          [ -n "$so" ] && cp "$so" symbols/libhengegpu.so && file symbols/libhengegpu.so
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: symbols
          path: symbols/

      - name: Publish a versioned release
        if: env.V != 'latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.V }}
          target_commitish: ${{ github.sha }}
          name: Henge for Android ${{ env.V }} (experimental)
          prerelease: true
          make_latest: false
          body_path: notes.md
          files: |
            Henge-android-${{ env.V }}.apk
            hengevm-android-arm64-${{ env.V }}.tar.gz
            SHA256SUMS.txt

      - name: Publish as the latest build
        if: env.V == 'latest' && github.ref == 'refs/heads/android-port'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Henge for Android (latest build)
          prerelease: true
          make_latest: false
          body: |
            Built from ${{ github.sha }}. Install Henge-android.apk on an arm64 Android device (Android 10+).
          files: Henge-android.apk
