name: Kernel with udmabuf (Xiaomi Pad 7)
# android/kernel/README.md. Google's android14-6.1 kernel at the tablet's commit, with CONFIG_UDMABUF=y.
on:
  workflow_dispatch:
    inputs:
      stock:
        description: 'The stock kernel (Image or boot.img) whose module-signing certificate to trust; default: Google CI build 14529422'
        required: false
        default: ''
  push:
    branches: [android-port]
    paths: ['.github/workflows/kernel-udmabuf.yml']
permissions:
  contents: write
env:
  COMMIT: 0c3d559bcd85
  RELEASE: 6.1.138-android14-11-g0c3d559bcd85-ab14529422
  LOCALVERSION: -android14-11-g0c3d559bcd85-ab14529422
jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: The commit's full name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's mirror resolves a short name; else every android14-6.1 branch's commits (no trees) are searched.
          full=$(gh api "repos/aosp-mirror/kernel_common/commits/$COMMIT" -q .sha 2>/dev/null || true)
          if ! echo "$full" | grep -Eq '^[0-9a-f]{40}$'; then
            mkdir find && cd find && git init -q
            # Branches of past releases are deleted; their tags stay.
            git fetch -q --filter=tree:0 --no-tags https://android.googlesource.com/kernel/common \
              '+refs/heads/android14-6.1*:refs/remotes/o/android14-6.1*' '+refs/tags/android14-6.1*:refs/tags/android14-6.1*'
            git tag | tail -60
            full=$(git rev-parse --verify "$COMMIT^{commit}")
          fi
          echo "$full"
          echo "FULL=$full" >> "$GITHUB_ENV"
      - name: Kernel source and Google's build tools
        run: |
          mkdir -p ~/bin && curl -sS https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo && chmod +x ~/bin/repo
          mkdir k && cd k
          ~/bin/repo init -q -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1 --depth=1
          ~/bin/repo sync -q -c --no-tags -j8
          cd common
          git fetch -q --depth=1 https://android.googlesource.com/kernel/common "$FULL"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %s'
          df -h /
      - name: The stock kernel's module-signing certificate
        working-directory: k
        env:
          STOCK: ${{ inputs.stock }}
        run: |
          # The modules in system_dlkm are signed by the key of Google's build ab14529422. Its public certificate is
          # in that build's kernel image; trusted here too, those modules verify as signed and MODULE_SIG_PROTECT
          # stays on, as in the stock kernel.
          url=${STOCK:-https://ci.android.com/builds/submitted/14529422/kernel_aarch64/latest/raw/Image}
          curl -fsSL --retry 3 -o stock.bin "$url"
          if [ "$(head -c 8 stock.bin)" = "ANDROID!" ]; then
            python3 tools/mkbootimg/unpack_bootimg.py --boot_img stock.bin --out stock_unpacked >/dev/null
            cp stock_unpacked/kernel stock.bin
          fi
          strings stock.bin | grep -m1 '^Linux version' | tee stock_version.txt
          grep -q "Linux version $RELEASE " stock_version.txt
          python3 - <<'PY'
          import subprocess
          k = open('stock.bin', 'rb').read()
          certs, i = [], 0
          while True:
              i = k.find(b'\x30\x82', i)
              if i < 0: break
              n = 4 + int.from_bytes(k[i + 2:i + 4], 'big')
              der = k[i:i + n]
              if b'Build time autogenerated kernel key' in der and der not in certs:
                  r = subprocess.run(['openssl', 'x509', '-inform', 'der', '-outform', 'pem'], input=der, capture_output=True)
                  if r.returncode == 0: certs.append(der); open('common/certs/gki_stock.pem', 'ab').write(r.stdout)
              i += 2
          assert len(certs) == 1, f'{len(certs)} signing certificates in the stock kernel'
          PY
          openssl x509 -in common/certs/gki_stock.pem -noout -subject -ext subjectKeyIdentifier
      - name: udmabuf on, the stock certificate trusted, the original's release string
        working-directory: k/common
        run: |
          grep -n 'CONFIG_MODULE_SIG_PROTECT\|CONFIG_UDMABUF\|CONFIG_SYSTEM_TRUSTED_KEYS' arch/arm64/configs/gki_defconfig || true
          sed -i '/^CONFIG_SYSTEM_TRUSTED_KEYS=/d' arch/arm64/configs/gki_defconfig
          echo 'CONFIG_UDMABUF=y' >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_SYSTEM_TRUSTED_KEYS="certs/gki_stock.pem"' >> arch/arm64/configs/gki_defconfig
          # The build's check that gki_defconfig is in `savedefconfig` order would refuse the appended line.
          grep -rn 'check_defconfig' build.config.* || true
          sed -i 's/check_defconfig//g' build.config.*
          # The release string, whatever the build would have made of this tree's state.
          printf '#!/bin/sh\necho "%s"\n' "$LOCALVERSION" > scripts/setlocalversion
          git diff --stat
      - name: Build
        working-directory: k
        run: |
          tools/bazel run //common:kernel_aarch64_dist -- --dist_dir=$PWD/out/dist
          ls -la out/dist | head -60
      - name: It is the kernel asked for
        working-directory: k
        run: |
          strings out/dist/Image | grep -m1 '^Linux version' | tee version.txt
          grep -q "Linux version $RELEASE " version.txt
          python3 - <<'PY'
          import zlib
          k = open('out/dist/Image', 'rb').read()
          i = k.find(b'IKCFG_ST')
          c = zlib.decompressobj(31).decompress(k[i + 8:]).decode()
          for key in ('CONFIG_UDMABUF', 'CONFIG_MODULE_SIG_PROTECT', 'CONFIG_SYSTEM_TRUSTED_KEYS', 'CONFIG_MODVERSIONS', 'CONFIG_GUNYAH=', 'CONFIG_TRIM_UNUSED_KSYMS'):
              print([l for l in c.splitlines() if key in l])
          assert 'CONFIG_UDMABUF=y' in c and 'CONFIG_MODULE_SIG_PROTECT=y' in c
          # The stock build's certificate is among the ones this kernel trusts.
          import subprocess
          der = subprocess.run(['openssl', 'x509', '-in', 'common/certs/gki_stock.pem', '-outform', 'der'],
                               capture_output=True, check=True).stdout
          assert der in k, 'the stock signing certificate is not in the new kernel'
          print('stock module-signing certificate: trusted')
          PY
      - name: boot image
        working-directory: k
        run: |
          # As the tablet's own: header v4, the kernel alone and uncompressed, Android 17.0.0 / 2026-10, 96 MB.
          python3 tools/mkbootimg/mkbootimg.py --header_version 4 --kernel out/dist/Image \
            --os_version 17.0.0 --os_patch_level 2026-10 -o boot-udmabuf.img
          avb=$(ls external/avb/avbtool.py prebuilts/kernel-build-tools/linux-x86/bin/avbtool 2>/dev/null | head -1)
          echo "avbtool: $avb"
          python3 "$avb" add_hash_footer --image boot-udmabuf.img --partition_name boot --partition_size 100663296 \
            || "$avb" add_hash_footer --image boot-udmabuf.img --partition_name boot --partition_size 100663296
          ls -la boot-udmabuf.img
          sha256sum boot-udmabuf.img out/dist/Image | tee sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-udmabuf
          path: |
            k/boot-udmabuf.img
            k/out/dist/Image
            k/out/dist/System.map
            k/out/dist/vmlinux.symvers
            k/sha256.txt
            k/version.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: k
        run: |
          gh release delete kernel-udmabuf -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create kernel-udmabuf -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Kernel with udmabuf for the Xiaomi Pad 7 (untested)" \
            --notes "$RELEASE with CONFIG_UDMABUF=y, module protection as stock (the stock build's module-signing certificate trusted). Untested: keep your original boot image and fastboot at hand. See android/kernel/README.md." \
            boot-udmabuf.img sha256.txt
