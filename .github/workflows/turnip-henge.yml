name: Henge's Turnip (KGSL coherent imports)

# Builds android/gpu/turnip alone: the check that the driver patch still applies and compiles, without the
# whole APK. The APK's own workflow builds (and caches) the same library.
on:
  push:
    branches: [android-port]
    paths: ['android/gpu/turnip/**', '.github/workflows/turnip-henge.yml']
  workflow_dispatch:

jobs:
  turnip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          for try in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q glslang-tools bison flex pkg-config && break
            [ $try = 3 ] && exit 1
            sleep 20
          done
          pip install --user meson ninja mako pyyaml packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          TURNIP_WORK: /home/runner/turnip-henge-work
        run: |
          android/gpu/turnip/build.sh "$HOME/turnip-henge"
          so=$HOME/turnip-henge/libvulkan_freedreno.so
          file "$so"; readelf -d "$so" | grep NEEDED || true
          readelf -W --dyn-syms "$so" | awk '$7 != "UND" {print $8}' | grep -x -e HMI -e vk_icdGetInstanceProcAddr
          strings -a "$so" | grep -e TU_KGSL_IMPORT_COHERENT -e 'dma-buf imports' | head

      - uses: actions/upload-artifact@v4
        with:
          name: turnip-henge
          path: ~/turnip-henge/libvulkan_freedreno.so
