plugins { id 'com.android.application' }

android {
    namespace 'dev.henge.android'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.henge.android'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '0.1.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without a keystore of your own.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // The engine is an executable shipped as lib*.so: it must be extracted to run.
    packaging { jniLibs { useLegacyPackaging true } }
}
