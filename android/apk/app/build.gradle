plugins { id 'com.android.application' }

android {
    namespace 'dev.henge.android'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.henge.android'
        minSdk 29
        targetSdk 34
        versionCode 57
        versionName '0.3.52'
        ndk { abiFilters 'arm64-v8a' }
    }
    // One key for every build (CI's runners make a new debug key each run, and Android only updates an
    // app signed with the same key: otherwise it must be uninstalled, taking the Mac and the download
    // with it). Not a secret: it only lets builds of this app replace each other.
    signingConfigs {
        henge {
            storeFile rootProject.file('henge-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.henge }
        release {
            minifyEnabled false
            signingConfig signingConfigs.henge
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // The engine is an executable shipped as lib*.so: it must be extracted to run. So is air2spv
    // (libair2spv.so), which the renderer runs to translate macOS's shaders.
    packaging { jniLibs { useLegacyPackaging true } }
    // libhengegpu.so: the Vulkan renderer (android/gpu/replay).
    externalNativeBuild { cmake { path '../../gpu/replay/CMakeLists.txt' } }
    // CI runners carry an NDK: use it (and say its version, which AGP checks) rather than downloading one.
    def ndk = System.getenv('ANDROID_NDK_LATEST_HOME')
    if (ndk) {
        def props = new Properties()
        new File(ndk, 'source.properties').withInputStream { props.load(it) }
        ndkPath ndk
        ndkVersion props.getProperty('Pkg.Revision')
    }
}
