plugins { id 'com.android.application' }

android {
    namespace 'dev.henge.android'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.henge.android'
        minSdk 29
        targetSdk 34
        versionCode 5
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without a keystore of your own.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // The engine is an executable shipped as lib*.so: it must be extracted to run. So is air2spv
    // (libair2spv.so), which the renderer runs to translate macOS's shaders.
    packaging { jniLibs { useLegacyPackaging true } }
    // libhengegpu.so: the Vulkan renderer (android/gpu/replay).
    externalNativeBuild { cmake { path '../../gpu/replay/CMakeLists.txt' } }
    // CI runners carry an NDK: use it rather than downloading the default one.
    def ndk = System.getenv('ANDROID_NDK_LATEST_HOME')
    if (ndk) ndkPath ndk
}
